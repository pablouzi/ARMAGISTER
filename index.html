<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personaje WebAR | A-Frame 1.8.0</title>
  <meta name="theme-color" content="#111827">
  <style>
    html, body { margin: 0; height: 100%; background: #101827; font-family: system-ui, sans-serif; }
    #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    #status { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 14px; right: 14px;
      margin: auto; width: fit-content; max-width: calc(100% - 28px); padding: 10px 15px;
      border-radius: 14px; background: rgba(10, 15, 27, .78); color: white;
      font-size: 14px; text-align: center; line-height: 1.35; }
    #help { position: absolute; bottom: max(70px, env(safe-area-inset-bottom)); left: 18px; right: 18px;
      text-align: center; color: #fff; font-size: 12px; text-shadow: 0 1px 8px #000; }
  </style>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="./js/app.js"></script>
</head>
<body>
  <div id="overlay">
    <div id="status" role="status" aria-live="polite">Cargando personaje…</div>
    <div id="help">En el teléfono: pulsa AR, apunta al suelo y toca para colocarlo.</div>
  </div>

  <a-scene
    embedded
    renderer="colorManagement: true; antialias: true"
    webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay,local-floor; overlayElement: #overlay; referenceSpaceType: local"
    ar-hit-test="target: #ancla; enabled: true"
    xr-character-app>

    <a-assets timeout="20000">
      <!-- Sustituye este archivo por tu GLB, conservando el nombre. -->
      <a-asset-item id="modelo-asset" src="./assets/personaje.glb"></a-asset-item>
    </a-assets>

    <!-- El ancla se posiciona en el suelo. El GLB debe tener su origen a la altura de los pies. -->
    <a-entity id="ancla" position="0 1.3 -2">
      <a-entity id="personaje" gltf-model="#modelo-asset" scale="1.5 1.5 1.5"
        character-animations="idle: idle; action: Action; fade: 0.2"></a-entity>
    </a-entity>

    <a-entity light="type: ambient; color: #fff; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #fff; intensity: 1" position="1 3 2"></a-entity>
    <a-entity camera look-controls position="0 1.6 0"></a-entity>
  </a-scene>
</body>
</html>
